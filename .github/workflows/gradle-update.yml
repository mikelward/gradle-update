name: Dependency update

# One batched Gradle dependency PR per week, as a REUSABLE workflow — the JVM
# sibling of npm-update, consumed with:
#
#   uses: mikelward/gradle-update/.github/workflows/gradle-update.yml@main
#
# from a small caller workflow that owns the cron. See README.md for the
# caller shape and the permissions it must grant.
#
# update-versions.mjs moves every entry in gradle/libs.versions.toml to the
# newest stable release WITHIN ITS CURRENT MAJOR, so a direct dependency
# cannot cross a major: the publish job re-derives that from the diff
# (check-versions-update.mjs) and stops the run if one did. Majors stay a
# deliberate, human-initiated migration.
#
# Beneath the catalog the promise is weaker than npm-update's: these repos
# have no Gradle lockfile, so a same-major direct bump can pull a new
# TRANSITIVE major with nothing in the catalog diff to show for it. The
# consumer's own test suite (run here) and its dispatched CI are the coverage
# for that. Read "no majors" as guaranteed for what the catalog declares,
# best-effort beneath it.
#
# The trust split is inherited from npm-update wholesale: resolving versions
# reads Maven METADATA only and executes no dependency code, but the Gradle
# checks that validate the batch execute dependency and plugin code by
# definition. So the update job holds no write token, the manifests are
# fingerprinted before Gradle runs, and the publish job — a fresh runner that
# installs nothing — is where the diff is actually validated and pushed.

on:
  workflow_call:
    inputs:
      catalog:
        description: Path to the Gradle version catalog.
        type: string
        default: gradle/libs.versions.toml
      cooldown-days:
        description: >-
          Minimum age in days of a release before this job will take it — the
          Gradle analog of .npmrc's min-release-age, so a compromised release
          has time to be yanked before an unattended job picks it up.
        type: number
        default: 5
      java-version:
        description: JDK major for the Gradle checks.
        type: string
        default: '21'
      checks:
        description: >-
          Commands that validate the batch, one per line. They run in the
          update job, after the catalog is rewritten and fingerprinted.
        type: string
        default: |
          ./gradlew test
          ./gradlew lint
      review-checks:
        description: >-
          Commands that flag the batch for HUMAN review, one per line — the
          consumer's license-diff check is the motivating case. They run
          after the checks and the regenerate commands, in the same
          untrusted window; any nonzero exit marks the PR "needs human
          review" (title and body) and leaves auto-merge unarmed, without
          failing the batch, and what the command printed is captured into
          the body's Review section as the reason. Tracked files a review
          check modifies are diffed into the report and restored — review
          checks observe, they never publish; a file the batch should
          publish belongs in regenerated-files instead. Empty disables.
        type: string
        default: ''
      regenerate:
        description: >-
          Commands that rebuild files derived from the dependency set (a
          bundled-license inventory, say), one per line. They run after the
          checks, in the same untrusted window; a failure stops the run,
          because publishing a batch whose derived files are stale is the
          silent drift this input exists to end. Empty disables.
        type: string
        default: ''
      regenerated-files:
        description: >-
          Tracked files the regenerate commands rebuild, one per line —
          committed with the catalog when they change, fingerprinted and
          verified the same way. The declaration is the boundary: only
          files named here may change during regeneration, and anything
          else the commands touch stops the run exactly as the tree check
          always has. Required when regenerate is set.
        type: string
        default: ''
      commit-prefix:
        description: >-
          Subject prefix for the batch commit and PR title. The Android repos
          keep dependency bumps out of release notes with `internal:`; the
          web repos use `deps:`.
        type: string
        default: 'internal:'
      ci-workflow:
        description: >-
          Workflow file to dispatch against the pushed branch, with a `pr`
          input naming the pull request — required because a PR opened by
          GITHUB_TOKEN triggers no `on: pull_request` workflows. It must
          carry `workflow_dispatch` on the default branch. Empty disables
          the dispatch.
        type: string
        default: android-ci.yml

# No permissions here: the CALLER grants them (contents: write,
# pull-requests: write, actions: write), and each job below downscopes. The
# job that runs unreviewed dependency code gets a read-only token; only the
# publish job, which runs none, can write.

jobs:
  # Rewrites the catalog and runs the checks. Gradle executes third-party
  # plugin and dependency code here, so this job holds no write token and
  # cannot push anything.
  update:
    runs-on: ubuntu-latest
    # The checks run unreviewed dependency code; without a bound, a hung
    # Gradle build holds the runner for the 6-hour job default.
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.changed.outputs.changed }}
      passed: ${{ steps.checks.outputs.passed }}
      review_flagged: ${{ steps.review.outputs.flagged }}
      regen_sha: ${{ steps.regen.outputs.files_sha }}
      base: ${{ steps.base.outputs.sha }}
      catalog_sha: ${{ steps.changed.outputs.catalog_sha }}
      engine_sha: ${{ steps.engine.outputs.sha }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          # Always the default branch, never the dispatch ref: a manual run
          # from a feature branch must not base the dependency branch on it.
          # (If the expression is ever empty, checkout falls back to the
          # default branch anyway, so the failure mode is benign.)
          ref: ${{ github.event.repository.default_branch }}
          # The Gradle checks execute unreviewed code; the token is read-only,
          # and dropping it from .git/config keeps one less credential in
          # reach anyway.
          persist-credentials: false

      # Pinned and handed to the publish job, so a commit landing on the
      # default branch while the checks run cannot be silently reverted by
      # publishing a catalog resolved against the older base.
      - name: Record the base commit
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The engine, from this repository at main — the same convention as
      # consuming the workflow itself at @main: no build step, no
      # dependencies, the file that runs is the file you can read there.
      - name: Fetch the update engine
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          repository: mikelward/gradle-update
          ref: main
          path: .jvm-update
          persist-credentials: false

      # One immutable revision for the whole run: the publish job checks the
      # validator out at THIS sha, so main advancing mid-run cannot validate
      # the batch under different rules than resolved it.
      - name: Record the engine revision
        id: engine
        run: echo "sha=$(git -C .jvm-update rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Reads Maven metadata over HTTPS and rewrites [versions] in place.
      # No dependency code executes here — that starts with the Gradle
      # checks below, after the fingerprint. The catalog path travels as an
      # environment variable here and in every later shell step: inlining it
      # into single-quoted script text would break on an apostrophe in a
      # custom path.
      - name: Resolve updates within their majors
        env:
          CATALOG: ${{ inputs.catalog }}
          # Typed as a number so it cannot carry shell syntax, but env is the
          # discipline every input here travels by — data, never script text.
          COOLDOWN_DAYS: ${{ inputs.cooldown-days }}
        run: |
          set -euo pipefail
          # Every comparison this workflow makes against the catalog path —
          # the reserved-name guard below, the tree check's literal
          # allowlist, the adoption diff — is a string comparison, so the
          # path must arrive in canonical workspace-relative form: a spelled
          # variant like `./gradle/…` names the same file while matching
          # none of the strings. Refuse anything non-canonical (with the
          # canonical spelling in the message) rather than guessing which
          # comparisons the variant would slip past.
          canon=$(realpath -m --relative-to="$PWD" -- "$CATALOG")
          if [ "$canon" != "$CATALOG" ]; then
            echo "::error::catalog path '$CATALOG' is not in canonical repo-relative form; use '$canon'."
            exit 1
          fi
          # The run writes these files and directories at the workspace root.
          # A catalog named like one of them would be clobbered by the run's
          # own output (the engine's report, most directly); one NESTED under
          # such a name means the checkout already occupies the name with a
          # directory the run cannot write over — and a catalog under the
          # engine or artifact directories would be deleted by their cleanup.
          # All of it is the same class, refused up front with the reason,
          # as exact names AND as path prefixes. `..` leaves the repository,
          # which no consumer's catalog does.
          case "$CATALOG" in
            ..|../*|report.md|checks.md|review.md|deps-stat.txt|handoff-catalog.toml|body.md|.jvm-update|.dependency-update|\
            report.md/*|checks.md/*|review.md/*|deps-stat.txt/*|handoff-catalog.toml/*|body.md/*|.jvm-update/*|.dependency-update/*)
              echo "::error::catalog path '$CATALOG' collides with a file or directory this workflow uses, or leaves the repository; choose a different catalog path."
              exit 1;;
          esac
          # The scratch names must also not be files the CONSUMER tracks:
          # the run would overwrite them before the checks read them, and
          # the tree check deliberately allowlists these names, so the
          # clobber would pass unseen. The engine and artifact directories
          # are the same class through a different mechanism — their cleanup
          # (`rm -rf`) would delete tracked content and the tree check would
          # abort every run on the deletions. Same answer: refuse with the
          # reason.
          tracked=$(git ls-files -- report.md checks.md review.md deps-stat.txt body.md handoff-catalog.toml .jvm-update .dependency-update)
          if [ -n "$tracked" ]; then
            echo "::error::this workflow writes scratch files at the workspace root that this repository tracks:"
            echo "$tracked"
            echo '::error::rename or move those files to run the weekly update.'
            exit 1
          fi
          node .jvm-update/update-versions.mjs \
            --catalog "$CATALOG" \
            --cooldown-days "$COOLDOWN_DAYS" \
            --markdown report.md
          # The engine has done its work; removing it keeps the tree check
          # below simple and honest.
          rm -rf .jvm-update

      - name: Stop early if nothing moved
        id: changed
        env:
          CATALOG: ${{ inputs.catalog }}
          # The catalog path is data everywhere, including as a git pathspec:
          # without this, a filename carrying pathspec syntax (`*`, `?`)
          # would glob instead of naming the one file.
          GIT_LITERAL_PATHSPECS: '1'
        run: |
          set -euo pipefail
          if git diff --quiet -- "$CATALOG"; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No dependency updates available this run.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            git diff --stat -- "$CATALOG" > deps-stat.txt
            # Fingerprint now, before any Gradle code runs. A step OUTPUT
            # rather than a file: the runner captures it when this step ends,
            # and nothing that runs afterwards can reach back and change it.
            echo "catalog_sha=$(sha256sum -- "$CATALOG" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
            git diff -- "$CATALOG" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up JDK
        if: steps.changed.outputs.changed == 'true'
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - name: Set up Gradle
        if: steps.changed.outputs.changed == 'true'
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2  # v5
        with:
          # This job runs unreviewed dependency code; it must never write the
          # shared Gradle cache — same rule the consumers' own CI applies to
          # non-main refs.
          cache-read-only: true

      # A PR opened by GITHUB_TOKEN triggers no `on: pull_request` workflows
      # (GitHub's loop-prevention rule), so the consumer's CI will NOT run on
      # the update PR by itself: the checks happen HERE or not at all. Every
      # check runs even after one fails, so the PR body reports the whole
      # picture. Gradle executes dependency and plugin code from the versions
      # this run just picked — this is the untrusted window.
      - name: Run the checks
        if: steps.changed.outputs.changed == 'true'
        id: checks
        env:
          CHECKS: ${{ inputs.checks }}
        run: |
          set +e
          failed=0
          : > checks.md
          while IFS= read -r cmd; do
            [ -z "$cmd" ] && continue
            echo "::group::$cmd"
            # A subshell, so a check that changes shell state — `cd app &&
            # ./gradlew test`, an export — cannot move where the loop writes
            # checks.md or where the next check runs. The runner command
            # files are pointed at /dev/null inside it: they are the channel
            # a planted process would use to forge THIS step's own outputs
            # (a "passed=true" written into $GITHUB_OUTPUT from inside a
            # check). Code running as this user can still hunt the real
            # files down on disk — same-machine isolation is not claimed,
            # and the design already reads check results as evidence, not
            # proof — but the casual channel costs one line to close.
            ( export GITHUB_OUTPUT=/dev/null GITHUB_ENV=/dev/null \
                GITHUB_PATH=/dev/null GITHUB_STEP_SUMMARY=/dev/null \
                GITHUB_STATE=/dev/null
              eval "$cmd" )
            rc=$?
            echo '::endgroup::'
            if [ $rc -eq 0 ]; then
              echo "- ✅ \`$cmd\`" >> checks.md
            else
              echo "- ❌ \`$cmd\` (exit $rc)" >> checks.md
              failed=1
            fi
          done <<< "$CHECKS"
          # FAIL CLOSED from here: the writes below are the authoritative
          # record, and a record that cannot be written (a check made the
          # file read-only, say) must go red rather than let a forged or
          # missing verdict decide the title and the arming.
          set -e
          cat checks.md >> "$GITHUB_STEP_SUMMARY"
          if [ $failed -eq 0 ]; then
            echo 'passed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'passed=false' >> "$GITHUB_OUTPUT"
          fi
          # Gradle build scripts and plugins ran above and $GITHUB_PATH /
          # $GITHUB_ENV apply to LATER steps, so a planted binary could
          # otherwise shadow `git` and `sha256sum` for the verification
          # below. Emptying them means the runner applies nothing.
          : > "$GITHUB_PATH"
          : > "$GITHUB_ENV"

      # Derived files are the batch's own product: a bundled-license
      # inventory rebuilt from the new dependency set belongs IN the batch,
      # not restored out of it — a consumer whose CI fails on inventory
      # drift would otherwise need a human regeneration push after every
      # benign bump. The declared list is the boundary: these commands run
      # unreviewed dependency and plugin code, so only files named in
      # regenerated-files may change here; anything else still stops the
      # run at the tree check. Each declared file is fingerprinted as a
      # step output the moment the commands finish — like the catalog, so
      # the review checks that run next, and anything else in this
      # untrusted window, can no longer alter what the publish job vouches
      # for.
      - name: Regenerate derived files
        if: steps.changed.outputs.changed == 'true' && inputs.regenerate != ''
        id: regen
        env:
          REGENERATE: ${{ inputs.regenerate }}
          REGENERATED_FILES: ${{ inputs.regenerated-files }}
          CATALOG: ${{ inputs.catalog }}
          GIT_LITERAL_PATHSPECS: '1'
        run: |
          set -euo pipefail
          # The declaration is load-bearing — it is the commit allowlist —
          # so an empty one is a configuration error, not a default.
          files=()
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            files+=("$f")
          done <<< "$REGENERATED_FILES"
          if [ "${#files[@]}" -eq 0 ]; then
            echo '::error::regenerate is set but regenerated-files is empty — declare the files the commands rebuild.'
            exit 1
          fi
          for f in "${files[@]}"; do
            # Scratch names would let a regeneration overwrite the run's
            # own reports and publish command-controlled content under the
            # workflow's name; the catalog is the engine's alone.
            case "$f" in
              report.md|checks.md|deps-stat.txt|review.md|body.md|regen-stat.txt|handoff-catalog.toml|handoff-regenerated.tar)
                echo "::error::regenerated-files must not name the run's own scratch file: $f"
                exit 1 ;;
            esac
            if [ "$f" = "$CATALOG" ]; then
              echo '::error::regenerated-files must not name the catalog — the engine owns it.'
              exit 1
            fi
            # Tracked files only: the publish job restores each one over a
            # checkout of the base, so a path with no base state has
            # nothing to be a regeneration OF — commit it by hand first.
            git ls-files --error-unmatch -- "$f" >/dev/null 2>&1 || {
              echo "::error::regenerated-files names a file git does not track: $f"
              exit 1
            }
          done
          # Same containment as the checks. A failure is a STOP, not a
          # flag: a batch whose derived files could not be rebuilt would
          # publish stale ones, which is the silent drift this step
          # exists to end.
          while IFS= read -r cmd; do
            [ -z "$cmd" ] && continue
            echo "::group::$cmd"
            ( export GITHUB_OUTPUT=/dev/null GITHUB_ENV=/dev/null \
                GITHUB_PATH=/dev/null GITHUB_STEP_SUMMARY=/dev/null \
                GITHUB_STATE=/dev/null
              eval "$cmd" )
            echo '::endgroup::'
          done <<< "$REGENERATE"
          # sha256sum's own "hash  path" lines, so the publish job can
          # verify the whole set with one `sha256sum -c`.
          {
            echo 'files_sha<<REGEN_SHA_EOF'
            sha256sum -- "${files[@]}"
            echo 'REGEN_SHA_EOF'
          } >> "$GITHUB_OUTPUT"
          git diff --stat -- "${files[@]}" >> "$GITHUB_STEP_SUMMARY"
          # Plugin code ran above; discard anything it queued for later
          # steps, same as every step in this window.
          : > "$GITHUB_PATH"
          : > "$GITHUB_ENV"

      # Review checks decide whether a HUMAN looks before the batch lands —
      # a nonzero exit flags the PR and holds auto-merge back, it does not
      # fail the batch. They run in the same untrusted window and under the
      # same containment as the checks. A review check may regenerate a
      # tracked file to compare it (the license-drift case); what it changed
      # is captured into the report as the thing the human reviews, then
      # restored — after each command, so no later command can erase the
      # evidence — and the tree check below still holds: nothing a review
      # check produced can ride the artifact. Restoring is only sound when
      # every tracked change is the review checks' own, so a tree the
      # ordinary checks already dirtied is refused up front — the same stop
      # the tree check would have delivered. The catalog itself is never
      # restored here — a review check that touches it fails the fingerprint
      # check below, as anything else would.
      - name: Run the review checks
        if: steps.changed.outputs.changed == 'true' && inputs.review-checks != ''
        id: review
        env:
          REVIEW_CHECKS: ${{ inputs.review-checks }}
          CATALOG: ${{ inputs.catalog }}
          REGENERATED_FILES: ${{ inputs.regenerated-files }}
          # Empty unless the regenerate step actually ran and fingerprinted
          # the declared files — the exemptions below key off THAT, so a
          # declared-but-not-regenerated file is still treated as any other
          # tree change.
          REGEN_SHA: ${{ steps.regen.outputs.files_sha }}
          GIT_LITERAL_PATHSPECS: '1'
        run: |
          set -euo pipefail
          # The restore below attributes every tracked modification to the
          # review checks — which is only true if the tree was clean (bar
          # the catalog) when they started. A tracked change the ORDINARY
          # checks left would otherwise be restored away here, masking
          # exactly what the tree check exists to stop. So that condition
          # is enforced now, with the tree check's own answer: refuse.
          # The same view the tree check uses — index, worktree, AND
          # untracked files — because every shape matters here: a change
          # the checks staged, left in the worktree, or dropped as a new
          # untracked file could otherwise be laundered through the review
          # step's restore before the tree check looks. (--no-renames so a
          # rename never emits the two-field porcelain record this parsing
          # does not read.) The run's own scratch files are the allowlist,
          # as below.
          # Regenerated files join the exemptions the way the catalog
          # does: legitimately changed before this step, never restored by
          # it, and guarded by their own fingerprints below — a review
          # check that touches one fails that check, as anything else
          # would. Keyed off REGEN_SHA, so the exemption exists only when
          # the regenerate step actually ran and fingerprinted them.
          exempt=(-e "$CATALOG" -e checks.md -e deps-stat.txt -e report.md)
          if [ -n "$REGEN_SHA" ]; then
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              exempt+=(-e "$f")
            done <<< "$REGENERATED_FILES"
          fi
          treestate() {
            git status --porcelain -z --untracked-files=all --no-renames \
              | tr '\0' '\n' | sed '/^$/d' | sed 's/^...//' \
              | grep -Fxv "${exempt[@]}" || true
          }
          # review.md is NOT exempt at this gate: this step writes its
          # report outside the workspace until the loop is done, so a
          # workspace review.md here was left by an ordinary check — an
          # unexpected file like any other. Refuse.
          # IGNORED paths get the same pre-pass as the final tree check
          # (same invocation, same allowlist): a review command could
          # otherwise remove an ignored file the ordinary checks planted,
          # erasing the evidence before that guard ever looks. The reports
          # the run has already written are exempt by exact name — a
          # consumer's .gitignore matching one reclassifies the workflow's
          # own file as ignored — but review.md is NOT: nothing
          # workflow-owned has written it yet.
          pre=$(treestate)
          preplanted=$(git status --porcelain -z --ignored \
            | tr '\0' '\n' | sed '/^$/d' \
            | grep '^!! ' \
            | sed 's/^!! //' \
            | grep -Ev '^((.*/)?\.gradle/|(.*/)?\.kotlin/|local\.properties$|(.*/)?build/)' \
            | grep -Fxv -e report.md -e checks.md -e deps-stat.txt || true)
          if [ -n "$pre" ] || [ -n "$preplanted" ]; then
            echo '::error::The checks changed the tree outside the version catalog. Not opening a PR — inspect these first:'
            if [ -n "$pre" ]; then echo "$pre"; fi
            if [ -n "$preplanted" ]; then echo "$preplanted"; fi
            exit 1
          fi
          flagged=0
          # The report accumulates OUTSIDE the workspace and is copied in
          # only after the last command: review commands run in the
          # workspace, so one that cleans untracked files (`git clean`,
          # say) could otherwise silently delete the evidence earlier
          # commands left. A workspace review.md appearing DURING the loop
          # is therefore a command's own doing — captured and restored
          # like any other file.
          REVIEW_TMP="$RUNNER_TEMP/review.md"
          : > "$REVIEW_TMP"
          # Two caps: 20,000 bytes per file AND a whole-report budget,
          # because the PR body has a hard 65,536-character limit and a
          # body that exceeds it fails to publish at all — which would
          # hide the review evidence exactly when it matters. The budget
          # is derived from what the REST of the body already spends —
          # report.md, checks.md and deps-stat.txt all exist by now, plus
          # 4,000 for the publish job's boilerplate — and never exceeds
          # 40,000. Once it is spent, the remainder collapses to ONE
          # closing line — a per-file notice each would itself grow
          # without bound. The budget spans all commands: it bounds the
          # report, not any one command's share of it.
          # The reports written earlier in the run are finished products
          # from here on; fingerprinted now so a review command that
          # rewrites one (a broad formatter, say) is caught below rather
          # than publishing command-controlled content under the
          # workflow's name — or growing a file past the budget derived
          # from its size.
          reports_sha=$(sha256sum report.md checks.md deps-stat.txt)
          other=$(( $(wc -c < report.md) + $(wc -c < checks.md) + $(wc -c < deps-stat.txt) ))
          budget=$(( 65536 - 4000 - other ))
          if [ "$budget" -gt 40000 ]; then budget=40000; fi
          if [ "$budget" -lt 0 ]; then budget=0; fi
          omitted=0
          omittedcmds=0
          # Capture $1's tree changes into review.md, then restore them —
          # ONE COMMAND AT A TIME, so every command starts from the tree
          # the ordinary checks left and a later command can neither
          # overwrite nor quietly undo the evidence an earlier one left
          # (a cleanup command restoring the regenerated license list
          # would otherwise leave a flagged PR with nothing to review).
          # The status view covers every shape a command can leave —
          # staged, worktree, staged-then-reverted (index differs while
          # the worktree matches HEAD), or a new untracked file; git diff
          # HEAD alone misses the last two. Nothing is exempt: the report
          # lives outside the workspace, so even a review.md a command
          # drops is that command's own change, captured and restored.
          capture_and_restore() {
            changed=$(treestate)
            if [ -z "$changed" ]; then
              return 0
            fi
            # The heading carries the command text — check-controlled
            # length — so it is charged with its fences as one unit before
            # anything is emitted; once it no longer fits, this command's
            # whole report collapses into the closing notice. The restore
            # below runs regardless — only reporting is capped.
            heading=$'\n'"What \`$1\` changed (restored after capture):"$'\n\n''```diff'
            budget=$((budget - $(printf '%s\n' "$heading" | wc -c) - 4))
            if [ "$budget" -ge 0 ]; then
              printf '%s\n' "$heading" >> "$REVIEW_TMP"
              reported=1
            else
              reported=0
            fi
            while IFS= read -r f; do
              if [ "$reported" -eq 0 ] || [ "$budget" -le 0 ]; then
                omitted=$((omitted + 1))
                # No room in the report, but the evidence must still live
                # somewhere a reviewer can reach: the step log takes the
                # full diff — logs have no body limit.
                echo "::group::omitted from the report — diff of $f"
                git diff --cached --no-renames -- "$f"
                git diff --no-renames -- "$f"
                echo '::endgroup::'
                continue
              fi
              # Both halves, because either can be empty while the other
              # carries the change: index vs HEAD (--cached) and worktree
              # vs index. Staged in a file OUTSIDE the workspace and
              # truncated from there: `git diff | head -c` would take
              # SIGPIPE on a large diff under pipefail and kill the step
              # mid-restore.
              {
                git diff --cached --no-renames -- "$f"
                git diff --no-renames -- "$f"
              } > "$RUNNER_TEMP/review-diff"
              size=$(wc -c < "$RUNNER_TEMP/review-diff")
              # Every line this loop emits is charged against the budget,
              # notices included: their lengths carry check-controlled
              # filenames, so uncharged notices would grow the report
              # without bound — the exact hole the budget closes.
              if [ "$size" -eq 0 ]; then
                note="new file added by a review check (content not shown): $f"
                budget=$((budget - $(printf '%s\n' "$note" | wc -c)))
                if [ "$budget" -lt 0 ]; then
                  omitted=$((omitted + 1))
                else
                  printf '%s\n' "$note" >> "$REVIEW_TMP"
                fi
                continue
              fi
              take=$(( size < 20000 ? size : 20000 ))
              if [ "$take" -gt "$budget" ]; then take=$budget; fi
              if [ "$take" -gt 0 ]; then
                head -c "$take" "$RUNNER_TEMP/review-diff" >> "$REVIEW_TMP"
                budget=$((budget - take))
              fi
              if [ "$take" -lt "$size" ]; then
                # Charged BEFORE emitting, like every other line: the
                # notice carries the file's path, and a near-PATH_MAX name
                # could otherwise overshoot the boilerplate reserve. When
                # it does not fit, the closing notice covers it — the
                # file counts as omitted.
                note="… diff of $f truncated at $take of $size bytes (per-file and whole-report caps keep the PR body publishable) — the step log has it in full."
                budget=$((budget - $(printf '\n%s\n' "$note" | wc -c)))
                if [ "$budget" -ge 0 ]; then
                  printf '\n%s\n' "$note" >> "$REVIEW_TMP"
                else
                  omitted=$((omitted + 1))
                fi
                echo "::group::truncated in the report — full diff of $f"
                cat "$RUNNER_TEMP/review-diff"
                echo '::endgroup::'
              fi
            done <<< "$changed"
            if [ "$reported" -eq 1 ]; then
              echo '```' >> "$REVIEW_TMP"
            fi
            # A path the review checks ADDED (or the add half of a rename)
            # has nothing in HEAD to check out — restoring it means
            # unstaging it and deleting the file, where a modified or
            # deleted path restores from HEAD.
            while IFS= read -r f; do
              git reset -q -- "$f"
              if git cat-file -e "HEAD:$f" 2>/dev/null; then
                git checkout -q HEAD -- "$f"
              else
                rm -f -- "$f"
              fi
            done <<< "$changed"
          }
          # The whole loop runs fail-closed (set -e stays on): only each
          # command's own exit is caught, because a nonzero there is the
          # flag, not an error. The capture and restore are authoritative
          # — a failure in them must go red, not fall through.
          while IFS= read -r cmd; do
            [ -z "$cmd" ] && continue
            echo "::group::$cmd"
            rc=0
            # Captured to a file OUTSIDE the workspace so a flagging
            # command's own words can go into the report below; the log
            # still gets every byte, and a command that cleans the
            # workspace cannot delete this.
            ( export GITHUB_OUTPUT=/dev/null GITHUB_ENV=/dev/null \
                GITHUB_PATH=/dev/null GITHUB_STEP_SUMMARY=/dev/null \
                GITHUB_STATE=/dev/null
              eval "$cmd" ) > "$RUNNER_TEMP/review-out" 2>&1 || rc=$?
            cat -- "$RUNNER_TEMP/review-out"
            echo '::endgroup::'
            # The verdict line carries the command text too, so it is
            # charged the same way; a line past the cap folds into the
            # closing notice. The FLAG itself is never capped — flagged,
            # the title, and the unarmed auto-merge are computed from rc,
            # not from what the report had room to print.
            if [ "$rc" -eq 0 ]; then
              line="- ✅ \`$cmd\`"
            else
              line="- 🚩 \`$cmd\` (exit $rc) — human review requested"
              flagged=1
            fi
            budget=$((budget - $(printf '%s\n' "$line" | wc -c)))
            if [ "$budget" -ge 0 ]; then
              printf '%s\n' "$line" >> "$REVIEW_TMP"
            else
              omittedcmds=$((omittedcmds + 1))
            fi
            # A flagging command's own output is the REASON a human is
            # being asked to look — a license check names the exact entry
            # that changed — so it goes into the report, charged against
            # the same budget as the diffs and under the same per-item
            # cap. The step log above already carries it in full. Green
            # commands stay quiet: their output is progress noise, and
            # the ✅ line says everything the body needs.
            if [ "$rc" -ne 0 ] && [ -s "$RUNNER_TEMP/review-out" ]; then
              heading=$'\n'"What \`$cmd\` reported:"$'\n\n''```'
              size=$(wc -c < "$RUNNER_TEMP/review-out")
              take=$(( size < 20000 ? size : 20000 ))
              if [ "$take" -gt "$budget" ]; then take=$budget; fi
              charge=$(( $(printf '%s\n' "$heading" | wc -c) + take + 4 ))
              if [ "$take" -gt 0 ] && [ "$budget" -ge "$charge" ]; then
                budget=$((budget - charge))
                printf '%s\n' "$heading" >> "$REVIEW_TMP"
                head -c "$take" -- "$RUNNER_TEMP/review-out" >> "$REVIEW_TMP"
                printf '\n```\n' >> "$REVIEW_TMP"
                if [ "$take" -lt "$size" ]; then
                  note="… output truncated at $take of $size bytes — the step log has it in full."
                  budget=$((budget - $(printf '%s\n' "$note" | wc -c)))
                  if [ "$budget" -ge 0 ]; then
                    printf '%s\n' "$note" >> "$REVIEW_TMP"
                  else
                    omitted=$((omitted + 1))
                  fi
                fi
              else
                omitted=$((omitted + 1))
              fi
            fi
            capture_and_restore "$cmd"
          done <<< "$REVIEW_CHECKS"
          rm -f -- "$RUNNER_TEMP/review-diff" "$RUNNER_TEMP/review-out"
          if [ "$omitted" -gt 0 ] || [ "$omittedcmds" -gt 0 ]; then
            {
              echo
              echo "… whole-report cap reached — omitted: $omittedcmds command result(s) and diffs of $omitted changed file(s); the step log carries every omitted diff in full."
            } >> "$REVIEW_TMP"
          fi
          # The run's other reports live in the workspace, where a review
          # command that cleans untracked files could have deleted them.
          # That surfaces later as an opaque artifact failure — name the
          # actual cause here instead.
          for f in report.md checks.md deps-stat.txt; do
            if [ ! -f "$f" ]; then
              echo "::error::a review check deleted the run's own $f — fix the review-checks input; a review command must not touch the workflow's scratch files."
              exit 1
            fi
          done
          if [ "$(sha256sum report.md checks.md deps-stat.txt)" != "$reports_sha" ]; then
            echo "::error::a review check modified the run's own reports — fix the review-checks input; a review command must not touch the workflow's scratch files."
            exit 1
          fi
          # Only now does the report enter the workspace, after the last
          # command has run and been restored.
          cp -- "$REVIEW_TMP" review.md
          cat review.md >> "$GITHUB_STEP_SUMMARY"
          if [ $flagged -eq 0 ]; then
            echo 'flagged=false' >> "$GITHUB_OUTPUT"
          else
            echo 'flagged=true' >> "$GITHUB_OUTPUT"
          fi
          # Same reasoning as the checks step: review checks ran dependency
          # code, so discard anything they queued for later steps.
          : > "$GITHUB_PATH"
          : > "$GITHUB_ENV"

      # The checks above and the artifact below have to describe the SAME
      # tree. Anything outside the catalog is a stop, not something to strip
      # silently: a dependency that rewrites your source during a build is a
      # decision for a human.
      - name: Verify only the catalog changed
        if: steps.changed.outputs.changed == 'true'
        env:
          CATALOG: ${{ inputs.catalog }}
          CATALOG_SHA: ${{ steps.changed.outputs.catalog_sha }}
          REVIEW_CHECKS: ${{ inputs.review-checks }}
          REGENERATED_FILES: ${{ inputs.regenerated-files }}
          # Empty unless the regenerate step ran and fingerprinted the
          # declared files — every regenerated-file exemption below keys
          # off that, never off the declaration alone.
          REGEN_SHA: ${{ steps.regen.outputs.files_sha }}
        run: |
          set -euo pipefail
          # `git status`, not `git diff`: diff only sees tracked changes, so
          # an untracked file dropped into the tree by a plugin would sail
          # past it. The allowed extras are files this job writes itself.
          # `grep -Fx`, not a regex: the catalog path is data, and even the
          # default path's dots would otherwise match any character — a
          # planted `gradle/libsXversionsYtoml` must not ride the allowlist,
          # and a metacharacter in a custom path must not break the guard.
          # `-z` so git emits paths raw: its C-quoting of spaces and
          # non-ASCII would otherwise never equal the literal $CATALOG and
          # fail every publication under such a path.
          allow=(-e "$CATALOG" -e checks.md -e deps-stat.txt -e report.md)
          # Regenerated files are the batch's own product when the
          # regenerate step ran — expected to differ, vouched for by the
          # fingerprint check below rather than by this allowlist.
          derived=()
          if [ -n "$REGEN_SHA" ]; then
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              derived+=("$f")
              allow+=(-e "$f")
            done <<< "$REGENERATED_FILES"
          fi
          # review.md is workflow-owned only when review checks ran (that
          # step creates it, after refusing a preexisting one). With review
          # checks disabled nothing here writes it, so one appearing now is
          # a check's doing — exempting it would ship that content into the
          # PR body's Review section.
          if [ -n "$REVIEW_CHECKS" ]; then allow+=(-e review.md); fi
          unexpected=$(git status --porcelain -z --untracked-files=all \
            | tr '\0' '\n' | sed '/^$/d' \
            | sed 's/^...//' \
            | grep -Fxv "${allow[@]}" || true)
          if [ -n "$unexpected" ]; then
            echo '::error::The batch touched files outside the version catalog. Not opening a PR — inspect these first:'
            echo "$unexpected"
            exit 1
          fi
          # IGNORED paths as a separate pass — `--ignored` alone collapses a
          # fully-ignored directory to one entry, which is what makes looking
          # affordable; combined with --untracked-files=all it would list all
          # of ~/.gradle-scale noise file by file. The allowlist is Gradle's
          # own outputs; anything else ignored is something new in the tree
          # and worth a human look. The run's own scratch files are exempt
          # by exact name: a consumer whose .gitignore happens to match one
          # (a broad `*.md` rule, say) reclassifies the workflow's own
          # report as ignored, and without the exemption every weekly run
          # would abort on a file this job wrote itself. review.md is
          # workflow-owned only when review checks ran, same rule as the
          # untracked pass above — with them disabled, a gitignored
          # review.md a check dropped must still stop the run, or it would
          # ride the artifact into the PR body through the one pass that
          # no longer sees it.
          plantedallow=(-e report.md -e checks.md -e deps-stat.txt)
          if [ -n "$REVIEW_CHECKS" ]; then plantedallow+=(-e review.md); fi
          planted=$(git status --porcelain -z --ignored \
            | tr '\0' '\n' | sed '/^$/d' \
            | grep '^!! ' \
            | sed 's/^!! //' \
            | grep -Ev '^((.*/)?\.gradle/|(.*/)?\.kotlin/|local\.properties$|(.*/)?build/)' \
            | grep -Fxv "${plantedallow[@]}" || true)
          if [ -n "$planted" ]; then
            echo '::error::The batch left unexpected IGNORED files in the tree. Not opening a PR — inspect these first:'
            echo "$planted"
            exit 1
          fi
          # Nothing may have touched the catalog since the engine rewrote it.
          if [ "$(sha256sum -- "$CATALOG" | cut -d' ' -f1)" != "$CATALOG_SHA" ]; then
            echo '::error::The catalog changed AFTER the engine resolved it — something in the check run rewrote it. Not opening a PR.'
            exit 1
          fi
          # Nor the regenerated files since their step fingerprinted them —
          # this is what lets the review step leave them unrestored: any
          # later hand on one of them stops the run here.
          if [ -n "$REGEN_SHA" ]; then
            printf '%s\n' "$REGEN_SHA" | sha256sum -c --strict --quiet \
              || { echo '::error::A regenerated file changed AFTER the regenerate step fingerprinted it — something in the review run rewrote it. Not opening a PR.'; exit 1; }
          fi
          # The artifact names review.md unconditionally; a run with no
          # review checks configured still ships an empty one.
          [ -f review.md ] || : > review.md
          # The regenerated files travel as ONE tar under a fixed literal
          # name, for the same reason the catalog travels as
          # handoff-catalog.toml: upload-artifact reads its path list as
          # glob patterns, and consumer paths are data. NUL-delimited
          # verbatim names so no filename shape can smuggle options or
          # split into two. Always created — empty when the feature is
          # off — so the artifact's fixed path list never goes missing.
          if [ "${#derived[@]}" -gt 0 ]; then
            printf '%s\0' "${derived[@]}" | tar -cf handoff-regenerated.tar --null --verbatim-files-from -T -
          else
            tar -cf handoff-regenerated.tar -T /dev/null
          fi
          # Stage the catalog for the artifact under a fixed literal name:
          # upload-artifact reads its path list as GLOB PATTERNS, so a
          # metacharacter in a custom catalog path ([, ?) could silently
          # drop the catalog while the other three files keep
          # if-no-files-found happy — the publish job would then fail its
          # fingerprint check on every run. Copied AFTER the tree checks so
          # the copy itself never trips them.
          cp -- "$CATALOG" handoff-catalog.toml

      - name: Hand off the dependency diff
        if: steps.changed.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          # Four fixed literal names — nothing here came from an input, so
          # the action's glob reading cannot misinterpret any of them, and a
          # catalog under a hidden directory no longer needs special-casing.
          name: dependency-update
          path: |
            handoff-catalog.toml
            handoff-regenerated.tar
            checks.md
            review.md
            deps-stat.txt
            report.md
          retention-days: 1
          if-no-files-found: error

  # Publishes. Runs on a fresh runner, installs nothing, and executes no
  # dependency code — so the write token is never on a machine where an
  # unreviewed dependency has run.
  publish:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      # Dispatching the consumer's CI on the pushed branch is a write to the
      # Actions API — granted HERE and not to the update job, so dependency
      # code can never start a workflow.
      actions: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          # The exact commit the update job tested, not the branch tip.
          ref: ${{ needs.update.outputs.base }}
          persist-credentials: false

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0  # v5.0.0
        with:
          name: dependency-update
          # Its own directory, so no artifact filename can collide with a
          # consumer's real path — a catalog literally named
          # handoff-catalog.toml at the root would otherwise be the cp's own
          # destination and fail the publish forever.
          path: .dependency-update

      # The artifact traveled through a machine that ran dependency code;
      # check it against the fingerprint taken before any of that ran. The
      # fingerprint came across as a job output, which lives in the runner's
      # control plane rather than on that machine's disk. The catalog rode
      # the artifact under its fixed handoff name (upload-artifact globs its
      # path list, so the real path never goes near it) and is restored to
      # its true path here — the catalog is a tracked file, so its directory
      # already exists in the checkout. The catalog moves LAST, so even a
      # catalog named like one of the report files ends up holding the
      # verified catalog bytes, which the fingerprint then vouches for.
      - name: Check the artifact against the pre-check fingerprint
        env:
          CATALOG: ${{ inputs.catalog }}
          # Update-job outputs enter every run block in this job through env,
          # never inline: `${{ }}` expands into the script BEFORE bash runs,
          # so an output forged on the update runner (the file-command
          # channel its checks step documents as closable only casually)
          # would otherwise become code under this job's write token. As env
          # it is data, and a forged value is bounded to a failed comparison.
          CATALOG_SHA: ${{ needs.update.outputs.catalog_sha }}
          REGENERATED_FILES: ${{ inputs.regenerated-files }}
          REGEN_SHA: ${{ needs.update.outputs.regen_sha }}
          # The diffstat below names consumer paths — data, not patterns.
          GIT_LITERAL_PATHSPECS: '1'
        run: |
          set -euo pipefail
          mv -- .dependency-update/checks.md .dependency-update/review.md .dependency-update/deps-stat.txt .dependency-update/report.md .
          # The regenerated files, before the catalog so the catalog still
          # moves last. The tar was written on the machine that ran
          # dependency code, so nothing in it is trusted by name: it is
          # unpacked OUTSIDE the workspace, only the files the consumer's
          # own configuration declares are copied out of it — each one a
          # tracked path, restored over the base checkout — anything extra
          # in it is a stop, and the copies must then match the
          # fingerprints taken before any review code ran.
          : > regen-stat.txt
          if [ -n "$REGEN_SHA" ]; then
            mkdir -- "$RUNNER_TEMP/regenerated"
            tar -xf .dependency-update/handoff-regenerated.tar -C "$RUNNER_TEMP/regenerated"
            derived=()
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              derived+=("$f")
              [ -f "$RUNNER_TEMP/regenerated/$f" ] \
                || { echo "::error::The artifact is missing declared regenerated file: $f"; exit 1; }
              cp -- "$RUNNER_TEMP/regenerated/$f" "$f"
              rm -- "$RUNNER_TEMP/regenerated/$f"
            done <<< "$REGENERATED_FILES"
            leftover=$(find "$RUNNER_TEMP/regenerated" -type f -o -type l | head -n 1)
            if [ -n "$leftover" ]; then
              echo "::error::The regenerated-files artifact carried an undeclared file: $leftover"
              exit 1
            fi
            rm -rf -- "$RUNNER_TEMP/regenerated"
            printf '%s\n' "$REGEN_SHA" | sha256sum -c --strict --quiet \
              || { echo '::error::A regenerated file does not match what the update job fingerprinted.'; exit 1; }
            # The body's Regenerated section, taken NOW while the tree
            # still diffs against the base — after the commit below there
            # is nothing left to diff, and the adopted-branch path never
            # commits at all.
            git diff --stat -- "${derived[@]}" > regen-stat.txt
          fi
          cp -- .dependency-update/handoff-catalog.toml "$CATALOG"
          rm -rf -- .dependency-update
          [ "$(sha256sum -- "$CATALOG" | cut -d' ' -f1)" = "$CATALOG_SHA" ] \
            || { echo '::error::The catalog does not match what the update job resolved.'; exit 1; }

      - name: Fetch the validator
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          repository: mikelward/gradle-update
          # The exact revision the update job resolved with — never a moving
          # ref, so the batch is validated under the same rules that made it.
          ref: ${{ needs.update.outputs.engine_sha }}
          path: .jvm-update
          persist-credentials: false

      # The authoritative check on what this commit contains, and the reason
      # it lives HERE: this runner has executed no dependency code, so
      # `git show HEAD:<catalog>` and the downloaded artifact are both out of
      # the batch's reach. Only in-place, in-major, stable version bumps in
      # [versions] pass — and --verify-upstream re-asks the repositories that
      # each new version exists for every module sharing its key, published
      # outside the cooldown. That last part cannot come from the artifact or
      # the fingerprint: both originated on the machine that later ran the
      # batch's own Gradle code, so code compromised within-major could forge
      # a matching pair naming an hours-old release. Metadata over HTTPS from
      # a clean runner is exactly the work the trust split allows here.
      - name: Re-validate the dependency diff from a clean context
        env:
          CATALOG: ${{ inputs.catalog }}
          COOLDOWN_DAYS: ${{ inputs.cooldown-days }}
        run: |
          set -euo pipefail
          node .jvm-update/check-versions-update.mjs \
            --catalog "$CATALOG" --verify-upstream --cooldown-days "$COOLDOWN_DAYS"
          rm -rf .jvm-update

      - name: Stop if the default branch moved while the checks ran
        env:
          GH_TOKEN: ${{ github.token }}
          # Data, not script text — an apostrophe is legal in a git ref name.
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          # Env, not inline — see the fingerprint step.
          BASE: ${{ needs.update.outputs.base }}
        run: |
          set -euo pipefail
          # Percent-encoded: the argument is a URL path, and characters like
          # `#` are legal in a ref name — docs-lane.sh encodes for the same
          # reason.
          encoded=$(printf %s "$DEFAULT_BRANCH" | jq -sRr @uri)
          current=$(gh api "repos/${{ github.repository }}/commits/$encoded" --jq .sha)
          if [ "$current" != "$BASE" ]; then
            echo "::error::$DEFAULT_BRANCH moved from $BASE to $current while the checks ran, so the verified catalog and the branch it would land on no longer match. Re-run the workflow."
            exit 1
          fi

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          CATALOG: ${{ inputs.catalog }}
          # As a git pathspec the catalog path is data too: `git add` with a
          # filename carrying pathspec syntax (`*`, `?`) would otherwise glob
          # and stage the restored report files alongside the catalog.
          GIT_LITERAL_PATHSPECS: '1'
          # Data, not script text — a quote or $() in a consumer's input must
          # never change what this write-enabled job executes.
          COMMIT_PREFIX: ${{ inputs.commit-prefix }}
          CI_WORKFLOW: ${{ inputs.ci-workflow }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          # Env, not inline — see the fingerprint step.
          PASSED: ${{ needs.update.outputs.passed }}
          REVIEW_FLAGGED: ${{ needs.update.outputs.review_flagged }}
          CATALOG_SHA: ${{ needs.update.outputs.catalog_sha }}
          REGENERATED_FILES: ${{ inputs.regenerated-files }}
          REGEN_SHA: ${{ needs.update.outputs.regen_sha }}
        run: |
          set -euo pipefail
          # Keyed on the RUN's date: the job runs weekly, so a month-scoped
          # name would collide with the previous week's branch. The date is
          # the run's immutable created_at, NOT the wall clock — a rerun
          # after UTC midnight would otherwise compute a different name,
          # miss the earlier attempt's branch, and open a duplicate PR for
          # the same batch. (run_started_at won't do: it moves to the
          # latest attempt.)
          created=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq .created_at)
          today=${created%%T*}
          branch="deps/update-$today"

          # A failing check outranks a review flag in the title: a red batch
          # is broken first, reviewable second. Both are reported in full in
          # the body either way, and EITHER condition holds auto-merge back.
          if [ "$PASSED" != 'true' ]; then
            title="$COMMIT_PREFIX Update dependencies ($today) — CHECKS FAILING"
            verdict='**One or more checks failed.** Do not merge until they are fixed — the failures are real, not flakes to route around.'
          elif [ "$REVIEW_FLAGGED" = 'true' ]; then
            title="$COMMIT_PREFIX Update dependencies ($today) — NEEDS HUMAN REVIEW"
            verdict='All checks passed, but a review check flagged this batch — see **Review** below. Auto-merge is deliberately not armed; merge by hand once the flagged change is acceptable.'
          else
            title="$COMMIT_PREFIX Update dependencies ($today)"
            verdict='All checks passed in the job that produced this branch.'
          fi

          remote="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

          # Never force-push: the PR body tells reviewers to push fixes to
          # this branch. If today's branch already exists there are two
          # cases, and a RERUN of this very run is the common one: adopt the
          # existing branch when its catalog is byte-identical to the
          # verified artifact (it is this run's own earlier attempt — reuse
          # it and its PR instead of duplicating them). Anything else is a
          # different batch, so take a run+attempt-scoped name of its own —
          # attempt-scoped so a rerun after a fallback push cannot collide
          # with the earlier attempt's fallback and be rejected.
          adopt=false
          if git ls-remote --exit-code --heads "$remote" "$branch" >/dev/null 2>&1; then
            git fetch --quiet "$remote" "refs/heads/$branch"
            # Adoption vouches for the WHOLE branch, so the whole branch is
            # what gets checked: its complete diff against the recorded base
            # must be exactly the catalog, that catalog must match the
            # verified fingerprint, the head must be exactly ONE commit
            # past the base — the shape this run's own earlier attempt
            # pushed — AND that commit's entire message must be the title
            # THIS run intends to merge. The tree checks alone would also
            # admit a change-plus-revert history whose net diff is clean
            # (a rebase merge would replay those junk commits into main),
            # and the message check covers the channel the tree checks
            # can't see: a rebase merge preserves the commit subject, so an
            # earlier failing attempt's "— CHECKS FAILING" marker, or a
            # message amended after the fact (same tree, same parent, no
            # prefix — straight past the consumer's release-note filter),
            # must refuse adoption and take a fresh branch with the right
            # subject instead. (`-z` so a path git would quote still
            # compares literally.)
            diff_paths=$(git diff -z --name-only HEAD FETCH_HEAD | tr '\0' '\n' | sed '/^$/d')
            # The catalog must be in the diff, and everything else in it
            # must be a declared regenerated file whose FETCH_HEAD content
            # matches the fingerprint this run verified — the same bytes
            # vouched for above, just already on the branch. Any other
            # path, or a stale regeneration from an older attempt, refuses
            # adoption and takes a fresh branch.
            paths_ok=true
            printf '%s\n' "$diff_paths" | grep -Fxq -- "$CATALOG" || paths_ok=false
            while IFS= read -r p; do
              [ -z "$p" ] && continue
              [ "$p" = "$CATALOG" ] && continue
              if [ -z "$REGEN_SHA" ] || ! printf '%s\n' "$REGENERATED_FILES" | grep -Fxq -- "$p"; then
                paths_ok=false
                break
              fi
              want=''
              while IFS= read -r line; do
                [ -z "$line" ] && continue
                if [ "${line#*  }" = "$p" ]; then want=${line%%  *}; fi
              done <<< "$REGEN_SHA"
              if [ -z "$want" ] \
                 || [ "$(git show "FETCH_HEAD:$p" 2>/dev/null | sha256sum | cut -d' ' -f1)" != "$want" ]; then
                paths_ok=false
                break
              fi
            done <<< "$diff_paths"
            if [ "$paths_ok" = true ] \
               && [ "$(git rev-list --count HEAD..FETCH_HEAD)" = "1" ] \
               && [ "$(git log -1 --format=%B FETCH_HEAD)" = "$title" ] \
               && [ "$(git show "FETCH_HEAD:$CATALOG" 2>/dev/null | sha256sum | cut -d' ' -f1)" = "$CATALOG_SHA" ]; then
              adopt=true
              # The exact commit adoption vouched for — auto-merge below is
              # bound to it, so a push landing after this fingerprint cannot
              # ride the arming.
              validated_head=$(git rev-parse FETCH_HEAD)
              echo "Adopting existing branch $branch — base plus exactly the verified catalog (a rerun)." >> "$GITHUB_STEP_SUMMARY"
            else
              # This run supersedes the earlier attempt: whatever armed
              # the existing branch's PR was computed by an older run, and
              # this run's verdict — a review flag the earlier attempt did
              # not have, say — may be exactly what should hold that batch
              # back. Disarm it before falling back, so an outdated arming
              # cannot merge past today's result; the fallback PR below
              # carries this run's own verdict and its own arming.
              # Non-fatal — it errors when auto-merge was never armed.
              oldpr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls?head=${GITHUB_REPOSITORY_OWNER}:${branch}&state=open" \
                --jq '[.[] | select(.base.ref == env.DEFAULT_BRANCH)][0].number // empty')
              if [ -n "$oldpr" ]; then
                # The disarm and the verify are separate on purpose:
                # --disable-auto exits nonzero both when auto-merge was
                # never armed (the common case, fine) and when the API
                # call failed (an armed PR still armed — not fine), so
                # the exit code proves nothing. Only reading the state
                # back does, and a state that cannot be read or is still
                # armed is a STOP: continuing would leave a superseded PR
                # able to merge past this run's verdict.
                gh pr merge --disable-auto "$oldpr" >/dev/null 2>&1 || true
                armed=$(gh pr view "$oldpr" --json autoMergeRequest --jq '.autoMergeRequest != null') || {
                  echo "::error::could not confirm the auto-merge state of superseded PR #$oldpr — not continuing while it may still be armed."
                  exit 1
                }
                if [ "$armed" != 'false' ]; then
                  echo "::error::auto-merge on superseded PR #$oldpr could not be disarmed — not continuing while it is armed."
                  exit 1
                fi
                echo "Auto-merge on PR #$oldpr is confirmed disarmed — its branch is superseded by this run." >> "$GITHUB_STEP_SUMMARY"
              fi
              branch="$branch-run${{ github.run_number }}-${{ github.run_attempt }}"
              echo "Today's branch already exists with different content; using $branch instead." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

          if [ "$adopt" != true ]; then
            # Belt and braces on a fresh runner where nothing has run.
            git config --global core.hooksPath /dev/null
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git switch -c "$branch"
            # Stage by name: the artifact only carries these files, but naming
            # them keeps that true even if it ever carries more. Staging an
            # unchanged regenerated file is a no-op, so the batch commits
            # only what actually moved.
            git add -- "$CATALOG"
            if [ -n "$REGEN_SHA" ]; then
              while IFS= read -r f; do
                [ -z "$f" ] && continue
                git add -- "$f"
              done <<< "$REGENERATED_FILES"
            fi
            git commit -q -m "$title"
            git push "$remote" "HEAD:refs/heads/$branch"
            validated_head=$(git rev-parse HEAD)
          fi

          # A PR opened by GITHUB_TOKEN triggers no `on: pull_request`
          # workflows, so nothing would start CI on this branch by itself.
          # `workflow_dispatch` is the documented exception — a dispatch made
          # with GITHUB_TOKEN does create a run — so ask for one explicitly
          # against the branch just pushed, naming the PR so the consumer's
          # docs lane can bind the run to it. Non-fatal either way: the
          # branch is pushed and the update job has already run every check,
          # so a failed dispatch must not turn a pushed branch into no PR —
          # but it is reported in the PR BODY, because "CI never started" and
          # "CI passed quietly" look identical from the PR otherwise.
          # Only a PR still based on the default branch may be reused: the
          # adoption checks compared the branch's tree against that base, so
          # a PR someone retargeted would merge the verified catalog into a
          # branch nobody validated against. A retargeted PR is left alone
          # and a fresh, correctly-based one is opened beside it (GitHub
          # allows one open PR per head+base pair, so the create succeeds).
          pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls?head=${GITHUB_REPOSITORY_OWNER}:${branch}&state=open" \
            --jq '[.[] | select(.base.ref == env.DEFAULT_BRANCH)][0].number // empty')
          if [ -z "$pr" ]; then
            pr_url=$(gh pr create --title "$title" \
              --body 'Opening — the checks report lands in a moment.' \
              --base "$DEFAULT_BRANCH" --head "$branch")
            pr=${pr_url##*/}
          fi

          # Clear any stale auto-merge from a prior attempt NOW, before the
          # CI dispatch below: a required check going green while this step
          # is still editing the body would otherwise merge on an arming
          # this attempt never made. From here to the arming at the bottom,
          # the PR has no auto-merge at all; the passing path re-arms it,
          # pinned to the validated head. Same disarm-then-verify shape as
          # the superseded-branch case above: --disable-auto's exit code
          # cannot distinguish "was never armed" from "API call failed",
          # so only reading the state back proves the PR is unarmed — and
          # an unconfirmable or still-armed state is a stop, because this
          # run may be about to decide the batch must NOT merge.
          gh pr merge --disable-auto "$pr" >/dev/null 2>&1 || true
          armed=$(gh pr view "$pr" --json autoMergeRequest --jq '.autoMergeRequest != null') || {
            echo "::error::could not confirm the auto-merge state of PR #$pr — not continuing while a stale arming may survive."
            exit 1
          }
          if [ "$armed" != 'false' ]; then
            echo "::error::a stale auto-merge on PR #$pr could not be disarmed — not continuing while it is armed."
            exit 1
          fi

          ci_started=false
          if [ -n "$CI_WORKFLOW" ]; then
            if gh workflow run "$CI_WORKFLOW" --ref "$branch" -f pr="$pr"; then
              ci_started=true
            else
              echo "Could not start CI on $branch; the PR body says so." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

          {
            echo 'Every version catalog entry moved to the newest stable release **within'
            echo 'its current major**. No majors: those need a deliberate migration and'
            echo 'this job cannot produce one. (Transitives are resolved by Gradle from'
            echo 'these declared versions — the checks below are the coverage there.)'
            echo
            cat report.md
            echo '## Checks'
            echo
            cat checks.md
            echo
            if [ -s review.md ]; then
              echo '## Review'
              echo
              cat review.md
              echo
            fi
            echo "$verdict"
            echo
            if [ "$ci_started" = true ]; then
              echo '> These ran in the workflow job, not on this PR. A PR opened by'
              echo '> `GITHUB_TOKEN` does not trigger `on: pull_request` workflows, so CI'
              echo "> does not start here on its own — this job dispatched \`$CI_WORKFLOW\`"
              echo '> against the branch instead, and that run reports on this PR like any'
              echo '> other.'
            else
              echo '> **CI was not started on this branch, so the checks above are the only'
              echo '> ones that ran.** A PR opened by `GITHUB_TOKEN` does not trigger'
              echo '> `on: pull_request` workflows, and no dispatch succeeded. Push any'
              echo '> commit to the branch and CI runs normally from then on.'
            fi
            echo
            echo '## Changed'
            echo
            echo '```'
            cat deps-stat.txt
            echo '```'
            echo
            if [ -s regen-stat.txt ]; then
              echo '## Regenerated'
              echo
              echo 'Derived from the new dependency set and committed with it:'
              echo
              echo '```'
              cat regen-stat.txt
              echo '```'
              echo
            fi
            echo '---'
            echo '_Opened by the weekly gradle-update workflow._'
          } > body.md

          # A transient API failure here must not strand the PR on its
          # placeholder body under `set -e` — the assignment below still has
          # to run, because the assignee is how an unattended PR gets seen.
          edited=false
          for _ in 1 2 3; do
            if gh pr edit "$pr" --title "$title" --body-file body.md; then
              edited=true
              break
            fi
            sleep 5
          done
          if [ "$edited" != true ]; then
            echo "::warning::Could not publish the PR body for #$pr; it still carries the placeholder."
          fi

          # Put it in front of a human — an unattended weekly PR nobody is
          # assigned to is exactly the PR that goes unnoticed. Non-fatal: an
          # opened-but-unassigned PR is recoverable.
          reviewer='${{ github.repository_owner }}'
          if ! gh pr edit "$pr" --add-assignee "$reviewer" --add-reviewer "$reviewer"; then
            echo "Could not assign or request review from @$reviewer — the PR is open and needs a look." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

          # Arm auto-merge so a clean batch lands unattended; the ruleset's
          # required checks do the reviewing. ONLY when this run's own checks
          # passed: auto-merge waits for the ruleset's requirements, and a
          # consumer whose ruleset requires little (or whose CI dispatch
          # failed, leaving nothing red on the PR) would otherwise merge a
          # batch this very workflow titled CHECKS FAILING. A failing batch
          # stays open, assigned, and waits for a human — and so does a
          # review-flagged one: "needs human review" means no unattended
          # merge, whatever the checks said. Non-fatal: repos without
          # auto-merge allowed just fall back to manual.
          if [ "$PASSED" = 'true' ] && [ "$REVIEW_FLAGGED" != 'true' ]; then
            # Any stale arming was cleared right after the PR was identified,
            # so the only arming that can exist after this line is one bound
            # to the exact commit this run validated (the adopted FETCH_HEAD
            # or the commit just pushed): a concurrent push to the branch
            # between the fingerprint and this call would otherwise be what
            # a thin ruleset auto-merges. With the pin, that race makes this
            # command fail — and then the PR simply has no auto-merge and
            # waits for a human.
            if ! gh pr merge --auto --rebase --match-head-commit "$validated_head" "$pr"; then
              echo 'Could not arm auto-merge — the PR is open and waits for a manual merge.' \
                >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            # No arming here, and none survives from before: a prior
            # attempt's request was cleared before CI was dispatched, so the
            # required checks going green cannot merge a PR titled
            # CHECKS FAILING. The summary names which condition held it
            # back — a review flag is not a failure, and saying "failed"
            # for it would send whoever reads the run down the wrong path.
            if [ "$PASSED" != 'true' ]; then
              echo 'Checks failed, so auto-merge was deliberately not armed (and any earlier arming was cleared).' >> "$GITHUB_STEP_SUMMARY"
            else
              echo 'A review check flagged this batch for human review, so auto-merge was deliberately not armed (and any earlier arming was cleared).' >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
